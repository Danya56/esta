{% load static %}

<section class="my-10">
    <div class="text-center mb-10 flex flex-col gap-3">
        <h2 class="text-2xl font-montserrat font-bold tracking-tight">
            Оборудование
        </h2>
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4">
        {% for category in categories %}
            <a href="{% url 'category_detail' category.slug %}"
            class="group bg-esta-accent border-2 border-esta-accent rounded-xl overflow-hidden
                    flex flex-col
                    transition hover:scale-[1.02] hover:shadow-lg">
                <div class="relative aspect-square sm:aspect-[4/3] overflow-hidden">
                    {% if category.image %}
                        <img src="{{ category.image.url }}"
                            alt="{{ category.name }}"
                            loading="lazy"
                            class="w-full h-full object-cover
                                    transition duration-300 group-hover:scale-105">
                    {% else %}
                        <div class="w-full h-full flex items-center justify-center
                                    bg-esta-accent/60 text-white/40 text-3xl">
                            ★
                        </div>
                    {% endif %}
                </div>
                <h3 class="p-3 text-white sm:p-4 text-sm sm:text-base lg:text-lg
                        font-semibold leading-tight
                        text-esta-accent-contrast">
                    {{ category.name }}
                </h3>
            </a>
        {% endfor %}
    </div>
